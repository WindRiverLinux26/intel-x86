# Enable meta-clang-revival layer for OpenVINO GPU plugin support
CLANG_REVIVAL_ENABLED = "1"

# clang15-dev and spirv-llvm-translator-llvm15-dev conflict with oe-core
# llvm-dev/libllvmspirvlib-dev (same install paths, different versions).
# dev-pkgs IMAGE_FEATURE is incompatible with this fragment.
IMAGE_FEATURES:remove = "dev-pkgs"

# OpenVINO GPU plugin (Intel compute runtime via clang-revival-layer)

NON_MULTILIB_RECIPES:append = " intel-graphics-compiler intel-compute-runtime"

COMPATIBLE_MACHINE:pn-gmmlib = "${MACHINE}"
COMPATIBLE_MACHINE:pn-intel-graphics-compiler = "${MACHINE}"
COMPATIBLE_MACHINE:pn-intel-compute-runtime = "${MACHINE}"

PACKAGECONFIG:append:class-target:pn-intel-compute-runtime = " levelzero"

IMAGE_INSTALL:append = " intel-graphics-compiler intel-compute-runtime"
