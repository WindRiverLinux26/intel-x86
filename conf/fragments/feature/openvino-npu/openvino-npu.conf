# OpenVINO NPU plugin

NON_MULTILIB_RECIPES:append = " linux-npu-driver"

COMPATIBLE_MACHINE:pn-linux-npu-driver = "intel-x86-64"

KERNEL_FEATURES += "features/intel-npu/intel-npu.scc"

PACKAGECONFIG:append:class-target:pn-openvino-inference-engine = " intel-npu"

IMAGE_INSTALL:append = " linux-npu-driver linux-npu-driver-firmware linux-npu-driver-tests"
